[package]
name = "api"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "wobble's scripting protocol: the method table, the local socket server the app runs, a blocking client, and the MCP bridge"

# Deliberately tiny: no engine, no egui, no wgpu. Anything that speaks the
# protocol — the MCP bridge, a test, a pipeline tool written in Rust — links
# this and nothing else.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

[[bin]]
name = "wobble-mcp"
path = "src/bin/wobble-mcp.rs"
