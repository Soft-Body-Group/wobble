<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wobble · Soft Body Group</title>
<style>
  :root { --bg: #111214; --ink: #d8dade; --dim: #8a8f98; --warn: #ff5a5a; --accent: #3fd0e0; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  /* The page, not the app, sizes the canvas (webmain::window_attrs). */
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
  #boot, #boot-error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }
  #boot { color: var(--dim); }
  #boot-error { display: none; color: var(--warn); background: var(--bg); white-space: pre-wrap; }
  /* Drop target: invisible until something is dragged over the page. */
  #drop { position: fixed; inset: 0; display: none; place-items: center; pointer-events: none;
    background: rgba(17, 18, 20, .72); border: 2px dashed var(--accent); color: var(--accent); font-size: 18px; }
  #drop.on { display: grid; }
  #hint { position: fixed; right: 12px; bottom: 10px; color: var(--dim); font-size: 12px; pointer-events: none;
    background: rgba(17, 18, 20, .8); padding: 4px 8px; border-radius: 4px; transition: opacity .6s; }
  #hint.gone { opacity: 0; }
  #status { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); display: none; color: var(--ink);
    background: rgba(17, 18, 20, .9); padding: 8px 14px; border-radius: 6px; pointer-events: none; }
  #demo { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px;
    align-items: center; color: #fff; background: rgba(200, 40, 50, .92); padding: 6px 8px 6px 14px; border-radius: 6px;
    font-weight: 600; box-shadow: 0 2px 10px rgba(0, 0, 0, .4); }
  #demo button { all: unset; cursor: pointer; padding: 0 6px; font-size: 16px; line-height: 1; opacity: .8; }
  #demo button:hover { opacity: 1; }
</style>
</head>
<body>
<canvas id="wobble" tabindex="0"></canvas>
<script>
  // Size the backing store BEFORE the app starts (webmain::window_attrs):
  // the first frame must already be the real size.
  const c = document.getElementById("wobble"), d = window.devicePixelRatio || 1;
  c.width = Math.round(innerWidth * d); c.height = Math.round(innerHeight * d);
</script>
<div id="boot">loading wobble…</div>
<div id="boot-error"></div>
<div id="drop">drop to load as Reads</div>
<div id="hint">drop EXR · DPX · PNG · JPEG · MP4 · MOV files or folders anywhere to load them</div>
<div id="status"></div>
<div id="demo" role="status">This is just a demo! Not everything works.<button aria-label="dismiss" onclick="this.parentNode.remove()">×</button></div>
<input id="pick" type="file" multiple hidden
  accept=".wbl,.json,.exr,.dpx,.cin,.png,.jpg,.jpeg,.mp4,.mov,.m4v">
<script type="module">
  import { addMovie, isMovie } from "./movie.js";
  const $ = (id) => document.getElementById(id);
  const boot = $("boot");
  const fail = (msg) => {
    const e = $("boot-error");
    e.textContent = msg; e.style.display = "grid"; boot.remove();
  };

  // Every dropped item as {path, file}, folders walked. webkitGetAsEntry
  // must be read DURING the drop event, before the first await.
  async function dropped(dt) {
    const entries = [...dt.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    const out = [];
    const walk = async (entry, dir) => {
      if (entry.isFile) {
        out.push({ path: dir + entry.name, file: await new Promise((ok, no) => entry.file(ok, no)) });
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        for (;;) {
          const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
          if (!batch.length) break;
          for (const e of batch) await walk(e, dir + entry.name + "/");
        }
      }
    };
    if (entries.length) for (const e of entries) await walk(e, "/");
    else for (const f of dt.files) out.push({ path: "/" + f.name, file: f });
    return out;
  }

  let drops = 0;
  // Put files into wobble's file table and open them as Reads.
  async function load(items) {
    const root = `/dropped/${++drops}`, paths = [], st = $("status"), problems = [];
    st.style.display = "block";
    for (const [i, { path, file }] of items.entries()) {
      st.textContent = `reading ${i + 1} / ${items.length}: ${file.name}`;
      const p = root + path;
      if (isMovie(file.name)) {
        // A movie stays a File here (movie.js reads it a GOP at a time);
        // wobble's table only needs to know the name exists.
        try {
          await addMovie(p, file);
          wobble.wobble_put_file(p, new Uint8Array(0));
          paths.push(p);
        } catch (e) {
          problems.push(`${file.name}: ${e.message || e}`);
        }
        continue;
      }
      wobble.wobble_put_file(p, new Uint8Array(await file.arrayBuffer()));
      paths.push(p);
    }
    if (problems.length) {
      st.textContent = problems.join(" · ");
      setTimeout(() => (st.style.display = "none"), 9000);
    } else {
      st.style.display = "none";
    }
    if (!paths.length) return;
    wobble.wobble_open(paths);
    $("hint").classList.add("gone");
  }

  // The app's "save": the document, downloaded (webmain::download).
  window.wobbleDownload = (name, text) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  // The app's "open": this picker; setups and media go the way a drop does.
  window.wobblePick = () => $("pick").click();
  $("pick").addEventListener("change", async (e) => {
    const items = [...e.target.files].map((file) => ({ path: "/" + file.name, file }));
    e.target.value = "";
    if (items.length) await load(items);
    $("wobble").focus();
  });

  if (!navigator.gpu) {
    fail("This browser has no WebGPU. Try a recent Chrome, Edge or Safari.");
  } else {
    try {
      const mod = await import("./wobble.js");
      await mod.default();    // runs wobble's main(); the event loop takes over
      window.wobble = mod;    // wobble_put_file / wobble_open, for scripts
      boot.remove();
      $("wobble").focus();
    } catch (e) {
      fail(String(e && e.message || e));
      throw e;
    }
    let depth = 0;
    addEventListener("dragenter", (e) => { e.preventDefault(); depth++; $("drop").classList.add("on"); });
    addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; $("drop").classList.remove("on"); } });
    addEventListener("dragover", (e) => e.preventDefault());
    addEventListener("drop", async (e) => {
      e.preventDefault(); depth = 0; $("drop").classList.remove("on");
      const items = await dropped(e.dataTransfer);
      if (items.length) await load(items);
      $("wobble").focus();
    });
    setTimeout(() => $("hint").classList.add("gone"), 12000);
  }
</script>
</body>
</html>
