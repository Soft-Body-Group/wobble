[package]
name = "colour"
version = "0.1.0"
edition = "2021"
description = "Colour management copied from wobble's engine (color.rs, viewtf, lut.rs): colourspaces, input transforms as WGSL, view transforms (ACES 1.3, AgX, filmic, none). OpenDRT is wobble's GPLv3 feature and is not copied: its stub stands in."
publish = false

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
log.workspace = true
bytemuck.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
