[package]
name = "scrub_app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "scrub"
path = "src/main.rs"

[dependencies]
media = { path = "../media" }
model = { path = "../model" }
colour = { path = "../colour" }
api = { package = "scrub_api", path = "../api" }
png.workspace = true
base64 = "0.22"
ab_glyph = "0.2"
# The clip browser (seq_manip on imfram); the `clips` feature.
seq = { git = "https://github.com/Soft-Body-Group/seq_manip.git", rev = "ebd8d0076b8a1b262099ad542d7d2496d6eea682", optional = true }
imfram.workspace = true
# No default features: wobble's default `commerce` (accounts, payments) must
# never ride into a Scrub build, and release builds turn `fold` on.
wobble_app = { package = "app", path = "../../app", optional = true, default-features = false, features = ["movie"] }
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
winit.workspace = true
bytemuck.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
cpal = "0.18"
ffmpeg-next.workspace = true
half.workspace = true
lz4_flex = "0.11"
rayon.workspace = true
epaint_default_fonts = "0.36"
gif = "0.14"
# "request a feature" posts to the feedback Worker (src/feedback.rs).
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[features]
default = ["clips"]
# The clip browser pane: seq_manip's browser (Soft-Body-Group/seq_manip,
# fetched by git). `--no-default-features`
# builds Scrub without it.
clips = ["dep:seq"]
# Experimental: apply a Wobble comp to a clip (docs/wobble-clips.md). Off by
# default; also needs sequence > experimental > Wobble clips at run time.
wobble = []
# Experimental, ON in release builds (tools/release_public*): wobble hosted in
# process (src/fold.rs), so clips can be Wobble comps.
# Links wobble's app as a library: this build is GPL-3.0-or-later.
fold = ["dep:wobble_app"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The recorder's AVAssetWriter wants a completion block.
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Console"] }

# scrub.exe's icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
