# cargo-about config: `tools/third_party_licenses.sh` turns it into
# THIRD_PARTY_LICENSES.md, which ships in every build archive.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unlicense", "BSL-1.0", "0BSD",
    "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0", "IJG", "CDLA-Permissive-2.0",
    "LGPL-2.1-or-later", "GPL-3.0-or-later", "GPL-2.0-only", "WTFPL",
]
# Only what a shipped binary links: no dev or build-time crates.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# imfram (wobble's own UI crate, publish = false, MIT) is credited in NOTICE.md.
private = { ignore = true }
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

