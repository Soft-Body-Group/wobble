[package]
name = "geoplayer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "A 2dini drawing evaluated live in a web page: the wasm module a live web export embeds."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine = { path = "../engine", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
